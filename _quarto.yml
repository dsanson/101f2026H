project:
  title: "PHI 101-002"
  type: website

website:
  title: "PHI 101-002"
  description: "Course website for PHI 101 at Illinois State"
  site-url: "https://www.davidsanson.com/101f2026"
  repo-url: https://github.com/dsanson/101f2026
  repo-actions: [source, issue]
  favicon: media/favicon.png
  twitter-card: true
  open-graph: true
  page-footer: |
    © 2026 David Sanson. Created using [Quarto](https://quarto.org/).
  navbar:
    logo: media/favicon.png
    logo-alt: 'Φ'
    left:
      - href: index.md
        text: Home
      - href: syllabus.qmd
        text: Syllabus
      - href: schedule.md
        text: Schedule
      - href: https://www.davidsanson.com/learning-from-arguments-remix/
        text: Textbook
