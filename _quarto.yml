project:
  title: "PHI 101"
  type: website

website:
  title: "PHI 101-003"
  description: "Course webpage for PHI 101 at Illinois State"
  site-url: "https://www.davidsanson.com/101f2026H"
  repo-url: https://github.com/dsanson/101f2026H
  repo-actions: [source, issue]
  favicon: media/favicon.png
  twitter-card: true
  open-graph: true
  page-footer: |
    © 2026 David Sanson. Created using [Quarto](https://quarto.org/).
  navbar:
    logo: media/favicon.png
    logo-alt: 'Φ'
    left:
      - href: index.md
        text: Home
      - href: syllabus.qmd
        text: Syllabus
      - href: schedule.md
        text: Schedule
      - href: https://www.davidsanson.com/learning-from-arguments-remix/
        text: Textbook

bibliography: [references.json]
citeproc: true
filters:
  - label-bullets.lua

metadata:
  author:
  - name: David Sanson
  course: phi101

callout-appearance: minimal

format:
  html:
    axe: true
    respect-user-color-scheme: true
    template-partials:
      - title-metadata.html
    theme:
      light: 
        - flatly
        - theme-light.scss
        - custom.scss
      dark: 
        - darkly
        - custom.scss
    link-external-icon: true
    link-external-newwindow: true
    citations-hover: true
    footnotes-hover: true


