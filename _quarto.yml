  #   position: below-navbar
  #   type: info
  #   content: |
  #     First midterm on Wednesday Sep 16th! Closed book and closed notes. No electronic devices. Remember to bring a pen/pencil and a bluebook!


bibliography: [references.json]
citeproc: true

filters:
  - label-bullets.lua
  - custom-callout

custom-callout:
  argument:
    icon-symbol: "🥊"
    color: "yellow"
    appearance: "minimal"
  example:
    icon-symbol: "💭"
    color: "purple"
    appearance: "minimal"



metadata:
  author:
  - name: David Sanson
  course: phi101

callout-appearance: minimal

format:
  html:
    axe: true
    respect-user-color-scheme: true
    template-partials:
      - title-metadata.html
    theme:
      light: 
        - flatly
        - theme-light.scss
        - custom.scss
      dark: 
        - darkly
        - custom.scss
    link-external-icon: true
    link-external-newwindow: true
    citations-hover: true
    footnotes-hover: true

